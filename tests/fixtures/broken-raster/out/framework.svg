<?xml version="1.0" encoding="UTF-8"?>
<!--
  tests/fixtures/broken-raster/out/framework.svg
  一张「只有 dpi 不合规」的图：PLOS 单栏 66.8×50mm、字号 8pt（= 2.822 用户单位）、Arial、Okabe-Ito 蓝色。
  除了 figure.json 里写死的 dpi:150（PLOS 要 300），其余都合规 —— 用来验证检查器不会连坐误报。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="66.8mm" height="50mm" viewBox="0 0 66.8 50">
  <rect x="0" y="0" width="66.8" height="50" fill="#ffffff"/>

  <rect x="10" y="26" width="9" height="14" fill="#0072B2"/>
  <text x="14.5" y="44" text-anchor="middle" font-family="Arial, Helvetica, PingFang SC, sans-serif"
        font-size="2.822" fill="#000000">对照</text>

  <rect x="26" y="18" width="9" height="22" fill="#0072B2"/>
  <text x="30.5" y="44" text-anchor="middle" font-family="Arial, Helvetica, PingFang SC, sans-serif"
        font-size="2.822" fill="#000000">处理A</text>

  <rect x="42" y="14" width="9" height="26" fill="#0072B2"/>
  <text x="46.5" y="44" text-anchor="middle" font-family="Arial, Helvetica, PingFang SC, sans-serif"
        font-size="2.822" fill="#000000">处理B</text>

  <text x="33.4" y="10" text-anchor="middle" font-family="Arial, Helvetica, PingFang SC, sans-serif"
        font-size="2.822" fill="#333333">响应值</text>
</svg>
