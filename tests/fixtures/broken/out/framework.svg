<?xml version="1.0" encoding="UTF-8"?>
<!--
  tests/fixtures/broken/out/framework.svg
  这是一张「到处不合规」的示意图，专门用来验证 check.mjs 真能查出问题：
    1. 画布 190×260mm —— 比 Nature 双栏 183mm 宽、比单页最大高 247mm 高
    2. font-size=1.41 用户单位 = 4pt —— 低于期刊 5pt 下限
    3. 第一块文字比它的框宽（TEXT_OVERFLOW_PARENT）
    4. 第三段文字贴在右边缘并溢出画布（TEXT_OVERFLOW_CANVAS）
    5. 最后一个 rect 的 x=250，整体跑到画布外（ELEMENT_OUT_OF_CANVAS）
    6. 红 #e23a3a 与绿 #2e9e4f 同图，且 figure.json 的 palette=brand 没有色盲兜底
    7. font-family="Comic Sans MS" —— 装饰字体
  单位说明：viewBox 用 mm 做用户单位（190 宽画布对应 190mm），所以 1 用户单位 = 1mm，
  想要 7pt 就要写 font-size="2.469"（7 × 25.4 / 72）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="260mm" viewBox="0 0 190 260">
  <rect x="0" y="0" width="190" height="260" fill="#ffffff"/>

  <!-- 框 1：红，文字明显比框宽 -->
  <rect x="10" y="10" width="18" height="12" fill="#e23a3a"/>
  <text x="12" y="18" font-family="Comic Sans MS" font-size="1.41" fill="#111111">这是一个非常非常长的节点标签文字</text>

  <!-- 框 2：绿，和红同图且没有色盲兜底 -->
  <rect x="40" y="10" width="30" height="12" fill="#2e9e4f"/>
  <text x="42" y="18" font-size="1.41" fill="#ffffff">绿色节点</text>

  <!-- 文字贴着右边缘，估算宽度会溢出画布 -->
  <text x="175" y="40" font-size="1.41" fill="#111111">这段文字贴着画布右边缘会溢出去</text>

  <!-- 元素整块跑到画布外（x=250 > 画布宽 190） -->
  <rect x="250" y="40" width="30" height="10" fill="#e23a3a"/>
</svg>
